name: Homepage review

# Verification only. Deployments remain owned by Tachyon Cloud App.
on:
  pull_request:
    paths:
      - 'src/app/page.tsx'
      - 'src/app/home.module.css'
      - 'src/app/globals.css'
      - 'src/app/layout.tsx'
      - 'src/components/BrandLockup.tsx'
      - 'src/lib/homepage-content.ts'
      - 'public/assets/**'
      - 'tests/homepage-ui.spec.ts'
      - 'playwright.home.config.ts'
      - 'next.config.ts'
      - 'package*.json'
      - '.github/workflows/homepage-review.yml'

permissions:
  contents: read

concurrency:
  group: homepage-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run build
      - run: npx playwright test --config playwright.home.config.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: homepage-review
          path: |
            homepage-report/
            homepage-test-results/
          if-no-files-found: ignore
          retention-days: 7
